name: core_ai_example
description: "Demonstrates the core_ai plugin with four small Core AI models."
publish_to: 'none'

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_ai:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # An .aimodel is a directory: list each model directory.
  assets:
    - assets/models/affine.aimodel/
    - assets/models/accumulator.aimodel/
    - assets/models/image_to_tensor.aimodel/
    - assets/models/matmul_add.aimodel/
