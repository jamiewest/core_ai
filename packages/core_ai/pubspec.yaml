name: core_ai
description: >-
  Flutter bindings for Apple's Core AI framework: load .aimodel files,
  run tensor and image inference, and manage stateful models and compute pipelines.
version: 0.1.0
homepage: https://github.com/jamiewest/core_ai
repository: https://github.com/jamiewest/core_ai/tree/main/packages/core_ai
issue_tracker: https://github.com/jamiewest/core_ai/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CoreAIPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CoreAIPlugin
        sharedDarwinSource: true

topics:
  - machine-learning
  - ai
  - apple
  - inference
