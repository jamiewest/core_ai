name: core_ml
description: >-
  Flutter bindings for Apple's Core ML framework: compile and load models,
  inspect their inputs and outputs, and run single, batch and stateful predictions.
version: 0.1.0
homepage: https://github.com/jamiewest/core_ai
repository: https://github.com/jamiewest/core_ai/tree/main/packages/core_ml
issue_tracker: https://github.com/jamiewest/core_ai/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CoreMLPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CoreMLPlugin
        sharedDarwinSource: true

topics:
  - machine-learning
  - ai
  - apple
  - inference
